name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  contract:
    name: Orchestrator, contract and tools
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Install
        run: uv sync --frozen
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check src tests
      - name: Types
        run: uv run mypy
      - name: Tests (orchestrator and contract module)
        run: uv run pytest -q
      - name: Shell syntax
        run: bash -n bin/t2-deploy && bash -n bin/t2-contract
      - name: Run report schema is valid JSON
        run: python3 -m json.tool contract/run-report.schema.json > /dev/null
